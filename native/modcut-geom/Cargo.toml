[package]
name = "modcut-geom"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.105"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vectorcraft-geom = { path = "upstream/crates/geom" }
vectorcraft-pathops = { path = "upstream/crates/pathops" }
vectorcraft-trace = { path = "upstream/crates/trace" }
vectorcraft-doc = { path = "upstream/crates/doc" }
vectorcraft-color = { path = "upstream/crates/color" }
vectorcraft-pdf = { path = "upstream/crates/pdf" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
