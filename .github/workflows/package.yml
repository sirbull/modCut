name: Package installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - electron/**
      - renderer/**
      - sidecar/**
      - scripts/**
      - assets/**
      - package.json
      - package-lock.json
      - electron-builder.yml
      - .github/workflows/package.yml
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      # This repository currently has one hosted runner slot. Keeping the
      # matrix serial prevents later platforms timing out in GitHub's runner
      # queue while an earlier native installer is being built.
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            target: --mac --arm64
            artifact: modcut-macos-arm64
          - os: macos-15-intel
            target: --mac --x64
            artifact: modcut-macos-x64
          - os: windows-latest
            target: --win --x64
            artifact: modcut-windows-x64
          - os: ubuntu-latest
            target: --linux --x64
            artifact: modcut-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- ${{ matrix.target }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
